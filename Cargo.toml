[package]
name = "conductor-rs"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
default-run = "op-conductor"

[lib]
name = "conductor_rs"
path = "src/lib.rs"

[[bin]]
name = "op-conductor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.7", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4"
futures-util = "0.3"
humantime = "2.1"
openraft = { version = "0.10.0-alpha.20", features = ["serde", "type-alias"] }
pprof = { version = "0.15", features = ["prost-codec"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.38", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = { version = "2.5", features = ["serde"] }

[dev-dependencies]
tempfile = "3.10"
tower = { version = "0.5", features = ["util"] }
